[project]
name = "dz-catalog-analysis-sergeev-m26-555"
version = "0.1.0"
description = "Учебный анализ каталога фильмов: Python, ДЗ №1"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]
extend-exclude = [".uv-cache", ".uv-python"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
